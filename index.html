<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>スマホスピン</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { user-select: none; -webkit-user-select: none; touch-action: manipulation; }
    </style>
</head>
<body class="bg-gray-900 text-white font-sans h-screen flex flex-col items-center justify-center overflow-hidden relative">

    <!-- スタート画面 -->
    <div id="start-screen" class="flex flex-col items-center justify-center h-full w-full px-6 text-center absolute inset-0 z-50 bg-gray-900">
        <div class="mb-6 text-6xl">🔄</div>
        <h1 class="text-3xl font-bold mb-4">スマホスピン</h1>
        <p class="text-gray-400 mb-6 text-sm leading-relaxed">
            スマホを指に乗せて時計回りに回すゲームです。<br>
            <span class="text-yellow-400 font-bold">※必ずiPhone標準の「Safari」で開いてください</span>
        </p>
        <button id="start-btn" class="bg-blue-600 active:bg-blue-400 text-white font-bold py-4 px-10 rounded-full shadow-lg text-lg">
            センサーを許可して開始
        </button>
        <p id="error-msg" class="text-red-400 text-xs mt-4 px-4"></p>
    </div>

    <!-- ゲーム画面 -->
    <div id="game-screen" class="hidden flex-col items-center justify-center h-full w-full p-6 relative">
        
        <!-- ステータス表示 -->
        <div id="status-box" class="absolute top-12 bg-gray-800 border border-gray-700 rounded-lg px-6 py-3 shadow-lg w-4/5">
            <p id="status-text" class="text-yellow-400 font-bold text-center tracking-wide">準備中...</p>
        </div>

        <!-- スコア -->
        <div class="flex flex-col items-center justify-center mt-8">
            <span class="text-gray-500 text-sm font-semibold tracking-widest mb-1">SCORE</span>
            <div class="text-8xl font-mono font-bold text-white mb-1" id="score-val">0</div>
            <span class="text-gray-500 text-lg">回転</span>
        </div>

        <!-- 水平器＆回転メーター（視覚化） -->
        <div class="mt-8 relative w-48 h-48 border-4 border-gray-700 rounded-full flex items-center justify-center bg-gray-800">
            <!-- 水平の基準円 -->
            <div class="absolute w-14 h-14 border-2 border-green-500/50 rounded-full"></div>
            <!-- 回転針 -->
            <div id="progress-indicator" class="absolute w-1.5 h-22 bg-blue-500 rounded-full origin-bottom" style="top: 8px; transform: rotate(0deg);"></div>
            <!-- 水平器の気泡（傾きに合わせて動く） -->
            <div id="level-bubble" class="w-6 h-6 bg-green-400 rounded-full z-10 shadow-[0_0_10px_rgba(74,222,128,0.8)] transition-transform duration-75"></div>
        </div>

        <!-- センサー動作確認用 -->
        <div id="debug-info" class="absolute bottom-4 text-gray-400 text-xs font-mono text-center">
            センサー受信待機中...<br>（数値が0のままならSafariで開き直してください）
        </div>

        <!-- リトライボタン -->
        <button id="retry-btn" class="hidden absolute bottom-16 bg-blue-600 active:bg-blue-400 text-white font-bold py-3 px-8 rounded-full shadow-lg">
            もう一度遊ぶ
        </button>
    </div>

    <script>
        let gameState = 'IDLE';
        let rotationCount = 0;
        let accumulatedAngle = 0;
        let stableStartTime = 0;

        // 角度計算用（DeviceOrientationベース）
        let lastAlpha = null;
        let currentBeta = 0;
        let currentGamma = 0;
        let currentAlpha = 0;
        let sensorReceived = false;

        document.getElementById('start-btn').addEventListener('click', async () => {
            const errorMsg = document.getElementById('error-msg');
            errorMsg.textContent = "センサー許可をリクエスト中...";

            try {
                // iOS 13+ の両方のセンサー許可を順番に取得
                if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                    const oriRes = await DeviceOrientationEvent.requestPermission();
                    if (oriRes !== 'granted') {
                        errorMsg.textContent = "傾きセンサーが許可されませんでした。Safariを完全に終了して再度開いてください。";
                        return;
                    }
                }
                if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
                    await DeviceMotionEvent.requestPermission();
                }

                initApp();
            } catch (e) {
                errorMsg.textContent = "エラー: Safariで開いているか確認してください (" + e.message + ")";
            }
        });

        document.getElementById('retry-btn').addEventListener('click', prepareGame);

        function initApp() {
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');
            document.getElementById('game-screen').classList.add('flex');
            
            // 水平器・コンパスと同じ確実性の高いイベントを使用
            window.addEventListener('deviceorientation', handleOrientation, true);
            // 落下衝撃用の補助イベント
            window.addEventListener('devicemotion', handleMotion, true);
            
            prepareGame();
        }

        function prepareGame() {
            gameState = 'STABILIZING';
            rotationCount = 0;
            accumulatedAngle = 0;
            stableStartTime = 0;
            lastAlpha = null;
            
            updateUI("指に乗せて水平に静止...", "text-yellow-400");
            document.getElementById('score-val').textContent = "0";
            document.getElementById('progress-indicator').style.transform = `rotate(0deg)`;
            document.getElementById('retry-btn').classList.add('hidden');
        }

        function updateUI(text, colorClass) {
            const statusText = document.getElementById('status-text');
            statusText.textContent = text;
            statusText.className = `font-bold text-center tracking-wide ${colorClass}`;
        }

        // 水平器とコンパスのセンサー処理
        function handleOrientation(event) {
            if (event.alpha === null && event.beta === null) return;
            sensorReceived = true;

            // iOSはwebkitCompassHeadingが時計回りの方位(0-360)
            // alphaは反時計回り(0-360)なので 360 - alpha で時計回りに統一
            let heading = (event.webkitCompassHeading !== undefined) 
                ? event.webkitCompassHeading 
                : (360 - (event.alpha || 0)) % 360;

            currentAlpha = heading;
            currentBeta = event.beta || 0;   // 縦傾き (-180 ~ 180)
            currentGamma = event.gamma || 0; // 横傾き (-90 ~ 90)

            // デバッグ表示更新
            document.getElementById('debug-info').textContent = 
                `方位:${Math.round(currentAlpha)}° | 縦傾き:${Math.round(currentBeta)}° | 横傾き:${Math.round(currentGamma)}°`;

            // 水平器の気泡を動かす（視覚フィードバック）
            const bubbleX = Math.max(-60, Math.min(60, currentGamma * 2));
            const bubbleY = Math.max(-60, Math.min(60, currentBeta * 2));
            document.getElementById('level-bubble').style.transform = `translate(${bubbleX}px, ${bubbleY}px)`;

            if (gameState === 'IDLE' || gameState === 'GAMEOVER') return;
            const currentTime = Date.now();

            // 水平判定（縦・横ともに傾きが15度以内なら水平とみなす）
            const isLevel = Math.abs(currentBeta) < 15 && Math.abs(currentGamma) < 15;

            // --- フェーズ1: 安定判定 ---
            if (gameState === 'STABILIZING') {
                // 回転していないかチェック
                let angleDiff = 0;
                if (lastAlpha !== null) {
                    angleDiff = Math.abs(currentAlpha - lastAlpha);
                    if (angleDiff > 180) angleDiff = 360 - angleDiff;
                }
                lastAlpha = currentAlpha;

                if (isLevel && angleDiff < 5) {
                    if (stableStartTime === 0) stableStartTime = currentTime;
                    
                    const remaining = Math.max(0, (2000 - (currentTime - stableStartTime)) / 1000).toFixed(1);
                    updateUI(`緑の円に気泡をキープ... ${remaining}秒`, "text-green-300");

                    if (currentTime - stableStartTime > 2000) {
                        gameState = 'PLAYING';
                        lastAlpha = currentAlpha;
                        if (navigator.vibrate) navigator.vibrate([100, 50, 100]); 
                        updateUI("スタート！時計回りに回せ！", "text-green-400");
                    }
                } else {
                    stableStartTime = 0;
                    updateUI("気泡を中央（水平）に合わせる...", "text-yellow-400");
                }
                return;
            }

            // --- フェーズ2: プレイ中 ---
            if (gameState === 'PLAYING') {
                // 1. 水平器応用：傾きが35度を超えたら指から落ちたと判定
                if (Math.abs(currentBeta) > 35 || Math.abs(currentGamma) > 35) {
                    triggerGameOver("バランスを崩した！（傾きすぎ）");
                    return;
                }

                // 2. 方位磁針応用：角度の差分から時計回りの回転量を計算
                if (lastAlpha !== null) {
                    let delta = currentAlpha - lastAlpha;
                    
                    // 359度 -> 1度 の境界またぎ補正（時計回り）
                    if (delta < -180) delta += 360;
                    // 1度 -> 359度 の境界またぎ補正（反時計回り）
                    if (delta > 180) delta -= 360;

                    // 時計回り（プラス方向）なら加算
                    if (delta > 0) {
                        accumulatedAngle += delta;
                        if (accumulatedAngle >= 360) {
                            rotationCount += Math.floor(accumulatedAngle / 360);
                            accumulatedAngle %= 360;
                            document.getElementById('score-val').textContent = rotationCount;
                        }
                    } else if (delta < 0) {
                        // 反時計回り（逆回転）は戻す
                        accumulatedAngle = Math.max(0, accumulatedAngle + delta);
                    }

                    document.getElementById('progress-indicator').style.transform = `rotate(${accumulatedAngle}deg)`;
                }
                lastAlpha = currentAlpha;
            }
        }

        // 補助：急激な落下衝撃の検知
        function handleMotion(event) {
            if (gameState !== 'PLAYING') return;
            const accel = event.acceleration;
            if (!accel) return;
            const impact = Math.sqrt((accel.x||0)**2 + (accel.y||0)**2 + (accel.z||0)**2);
            if (impact > 20) {
                triggerGameOver("落下衝撃を検知！");
            }
        }

        function triggerGameOver(reason) {
            gameState = 'GAMEOVER';
            if (navigator.vibrate) navigator.vibrate(500); 
            updateUI(reason, "text-red-500");
            document.getElementById('retry-btn').classList.remove('hidden');
        }
    </script>
</body>
</html>
